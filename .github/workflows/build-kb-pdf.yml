name: build-kb-pdf

# PRs: verify the committed PDF sidecar matches current docs. Contributors
# should regenerate in the same PR when possible — see pdf-docs/README.md.
#
# main / manual: verify first; if drifted, rebuild on Ubuntu and auto-commit
# so customer downloads stay in sync when a docs PR omits the PDF.

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/build_kb_pdf.py'
      - 'scripts/kb_pdf_style.css'
      - 'scripts/source_hash.py'
      - 'scripts/verify_kb_pdf.py'
      - '.github/workflows/build-kb-pdf.yml'
      - '.gitbook/assets/OcuTrap_Knowledge_Base.pdf'
      - '.gitbook/assets/OcuTrap_Knowledge_Base.pdf.sources.sha'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'scripts/build_kb_pdf.py'
      - 'scripts/kb_pdf_style.css'
      - 'scripts/source_hash.py'
      - 'scripts/verify_kb_pdf.py'
      - '.github/workflows/build-kb-pdf.yml'
      - '.gitbook/assets/OcuTrap_Knowledge_Base.pdf'
      - '.gitbook/assets/OcuTrap_Knowledge_Base.pdf.sources.sha'
  workflow_dispatch:

concurrency:
  group: build-kb-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify committed PDF source hash matches current docs
        run: python3 scripts/verify_kb_pdf.py

  sync-pdf:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libffi-dev
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: .cache/kb-pdf
          key: kb-pdf-${{ hashFiles('SUMMARY.md', '.gitbook/assets/**') }}
          restore-keys: |
            kb-pdf-
      - name: Check whether PDF is in sync
        id: check
        run: |
          if python3 scripts/verify_kb_pdf.py; then
            echo "synced=true" >> "$GITHUB_OUTPUT"
            echo "Knowledge Base PDF is already in sync."
          else
            echo "synced=false" >> "$GITHUB_OUTPUT"
            echo "Knowledge Base PDF is out of date — will rebuild."
          fi
      - name: Rebuild Knowledge Base PDF
        if: steps.check.outputs.synced == 'false'
        run: python3 scripts/build_kb_pdf.py
      - name: Commit regenerated PDF
        if: steps.check.outputs.synced == 'false'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitbook/assets/OcuTrap_Knowledge_Base.pdf \
                  .gitbook/assets/OcuTrap_Knowledge_Base.pdf.sources.sha
          if git diff --staged --quiet; then
            echo "::error::Rebuild completed but PDF and sidecar are unchanged."
            exit 1
          fi
          git commit -m "chore(kb-pdf): regenerate from docs [skip ci]"
          git push

name: build-kb-pdf

# Verifies that the committed Knowledge Base PDF matches what the build
# script would produce from the current docs by comparing source hashes
# (the script writes a `<pdf>.sources.sha` sidecar at build time).
#
# We do NOT rebuild the PDF in CI on purpose — pandoc and WeasyPrint
# produce slightly different output across environments (macOS vs
# Ubuntu, font availability, library versions), so a rebuilt-PDF
# comparison would false-fail. The source-hash comparison answers
# exactly the right question: "did the docs change since the PDF was
# generated?" without depending on cross-platform render reproducibility.
#
# We also do NOT auto-commit the PDF here — having two authors (the bot
# and contributors) for the same binary file caused merge conflicts on
# every overlapping PR.

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/build_kb_pdf.py'
      - 'scripts/kb_pdf_style.css'
      - '.github/workflows/build-kb-pdf.yml'
      - '.gitbook/assets/OcuTrap_Knowledge_Base.pdf.sources.sha'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'scripts/build_kb_pdf.py'
      - 'scripts/kb_pdf_style.css'
      - '.github/workflows/build-kb-pdf.yml'
      - '.gitbook/assets/OcuTrap_Knowledge_Base.pdf.sources.sha'
  workflow_dispatch:

concurrency:
  group: build-kb-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # No lfs:true needed — verify only reads markdown + script + sidecar.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify committed PDF source hash matches current docs
        run: python3 scripts/verify_kb_pdf.py
